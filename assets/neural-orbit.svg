<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">Samyak Anand — neural network</title>
<desc id="desc">A calm animated network of connected nodes in midnight blue, teal, cyan, and indigo.</desc>
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5EEAD4" stop-opacity=".15"/>
    <stop offset=".5" stop-color="#38BDF8" stop-opacity=".8"/>
    <stop offset="1" stop-color="#818CF8" stop-opacity=".18"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop stop-color="#38BDF8" stop-opacity=".18"/>
    <stop offset="1" stop-color="#07111F" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="220" rx="18" fill="#07111F"/>
<circle cx="600" cy="110" r="250" fill="url(#halo)"/>
<g stroke="url(#line)" stroke-width="1.4" fill="none">
  <path d="M70 142L190 70L310 120L430 54L555 110L680 54L805 120L930 70L1050 142L1140 88"/>
  <path d="M70 142L210 180L310 120L450 180L555 110L700 180L805 120L950 180L1050 142"/>
  <path d="M190 70L210 180M430 54L450 180M680 54L700 180M930 70L950 180"/>
  <path d="M310 120L555 110L805 120L1050 142" stroke-opacity=".45"/>
</g>
<g fill="#5EEAD4" filter="url(#glow)">
  <circle cx="70" cy="142" r="3"/><circle cx="310" cy="120" r="3.5"/><circle cx="555" cy="110" r="4"/><circle cx="805" cy="120" r="3.5"/><circle cx="1050" cy="142" r="3"/>
</g>
<g fill="#38BDF8" filter="url(#glow)">
  <circle cx="190" cy="70" r="3"/><circle cx="430" cy="54" r="3"/><circle cx="680" cy="54" r="3"/><circle cx="930" cy="70" r="3"/><circle cx="1140" cy="88" r="3"/>
</g>
<g fill="#818CF8" filter="url(#glow)">
  <circle cx="210" cy="180" r="2.5"/><circle cx="450" cy="180" r="2.5"/><circle cx="700" cy="180" r="2.5"/><circle cx="950" cy="180" r="2.5"/>
</g>
<g fill="#CFFAFE" opacity=".9">
  <circle r="3"><animateMotion dur="8s" repeatCount="indefinite" path="M70 142L190 70L310 120L430 54L555 110L680 54L805 120L930 70L1050 142"/></circle>
  <circle r="2.5"><animateMotion dur="10s" begin="-4s" repeatCount="indefinite" path="M210 180L310 120L450 180L555 110L700 180L805 120L950 180L1050 142"/></circle>
</g>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="103" fill="#F8FAFC" font-size="22" font-weight="700" letter-spacing="5">SAMYAK ANAND</text>
  <text x="600" y="128" fill="#8FA9BA" font-size="10" letter-spacing="3">INTELLIGENCE · ENGINEERING · IMPACT</text>
</g>
<path d="M40 205H1160" stroke="#5EEAD4" stroke-opacity=".12"/>
</svg>
