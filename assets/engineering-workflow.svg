<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Applied AI engineering workflow</title>
<desc id="desc">A four-stage engineering workflow from ingest through retrieval and evaluation to delivery, with validation and observability spanning the process.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071421"/><stop offset=".55" stop-color="#0b2235"/><stop offset="1" stop-color="#102d3d"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42d6c5"/><stop offset="1" stop-color="#6aa9ff"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9bc2d8" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="300" rx="22" fill="url(#bg)"/>
<rect width="1200" height="300" rx="22" fill="url(#grid)"/>
<circle cx="1090" cy="38" r="110" fill="#35c8bd" opacity=".07"/>
<circle cx="90" cy="280" r="145" fill="#548bff" opacity=".07"/>
<text x="54" y="48" fill="#7fded3" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">SYSTEMS WORKFLOW / 01</text>
<text x="54" y="80" fill="#f1f7fb" font-family="Arial,sans-serif" font-size="25" font-weight="700">From raw input to dependable output</text>
<g font-family="Arial,sans-serif">
  <path d="M250 166H365M535 166H650M820 166H935" stroke="url(#line)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M354 158L366 166L354 174M639 158L651 166L639 174M924 158L936 166L924 174" fill="none" stroke="#7fded3" stroke-width="2"/>
  <g>
    <rect x="54" y="119" width="196" height="94" rx="13" fill="#102d40" stroke="#2b6875"/>
    <circle cx="80" cy="146" r="12" fill="#174f5a"/><text x="80" y="150" text-anchor="middle" fill="#8ff0df" font-size="11">01</text>
    <text x="101" y="150" fill="#f4f8fb" font-size="16" font-weight="700">INGEST</text>
    <text x="74" y="181" fill="#a9c3d1" font-size="12">Data · documents · code</text>
  </g>
  <g>
    <rect x="366" y="119" width="169" height="94" rx="13" fill="#102d40" stroke="#2b6875"/>
    <circle cx="392" cy="146" r="12" fill="#174f5a"/><text x="392" y="150" text-anchor="middle" fill="#8ff0df" font-size="11">02</text>
    <text x="413" y="150" fill="#f4f8fb" font-size="16" font-weight="700">RETRIEVE</text>
    <text x="386" y="181" fill="#a9c3d1" font-size="12">Context · evidence</text>
  </g>
  <g>
    <rect x="651" y="119" width="169" height="94" rx="13" fill="#102d40" stroke="#2b6875"/>
    <circle cx="677" cy="146" r="12" fill="#174f5a"/><text x="677" y="150" text-anchor="middle" fill="#8ff0df" font-size="11">03</text>
    <text x="698" y="150" fill="#f4f8fb" font-size="16" font-weight="700">EVALUATE</text>
    <text x="671" y="181" fill="#a9c3d1" font-size="12">Tests · quality · traces</text>
  </g>
  <g>
    <rect x="936" y="119" width="210" height="94" rx="13" fill="#102d40" stroke="#2b6875"/>
    <circle cx="962" cy="146" r="12" fill="#174f5a"/><text x="962" y="150" text-anchor="middle" fill="#8ff0df" font-size="11">04</text>
    <text x="983" y="150" fill="#f4f8fb" font-size="16" font-weight="700">DELIVER</text>
    <text x="956" y="181" fill="#a9c3d1" font-size="12">APIs · interfaces · reports</text>
  </g>
  <path d="M150 230V246H1050V230" fill="none" stroke="#5c94a7" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="430" y="233" width="340" height="31" rx="15" fill="#12394a" stroke="#347a84"/>
  <text x="600" y="253" fill="#b9e8e2" font-size="12" text-anchor="middle" letter-spacing="1.5">VALIDATION  +  OBSERVABILITY</text>
</g>
</svg>