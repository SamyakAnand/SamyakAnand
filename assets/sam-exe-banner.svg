<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
<title>SAM.exe — Beyond the Prompt</title>
<desc>A cinematic original anime-inspired AI engineer in a dark violet cloak, framed by a luminous cosmic portal, orbital rings, stars, and futuristic interface details.</desc>
<defs>
 <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05040d"/><stop offset=".48" stop-color="#130b27"/><stop offset="1" stop-color="#080611"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#d8b4fe" stop-opacity=".95"/><stop offset=".12" stop-color="#a855f7" stop-opacity=".72"/><stop offset=".43" stop-color="#6d28d9" stop-opacity=".25"/><stop offset="1" stop-color="#080611" stop-opacity="0"/></radialGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5d0fe"/><stop offset=".45" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
 <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b2466"/><stop offset=".42" stop-color="#171027"/><stop offset="1" stop-color="#080611"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8c6f5"/><stop offset="1" stop-color="#76579f"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="micro" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c4b5fd" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1280" height="520" rx="28" fill="url(#space)"/>
<rect width="1280" height="520" rx="28" fill="url(#micro)"/>
<ellipse cx="920" cy="250" rx="390" ry="300" fill="url(#core)"/>
<ellipse cx="920" cy="250" rx="245" ry="185" fill="none" stroke="#a78bfa" stroke-opacity=".18" stroke-width="1"/>
<ellipse cx="920" cy="250" rx="310" ry="118" transform="rotate(-27 920 250)" fill="none" stroke="#c4b5fd" stroke-opacity=".34"/>
<ellipse cx="920" cy="250" rx="355" ry="150" transform="rotate(32 920 250)" fill="none" stroke="#8b5cf6" stroke-opacity=".26"/>
<path d="M650 260C735 70 1000 35 1170 205C1040 115 860 135 760 300C700 395 650 360 650 260Z" fill="#a855f7" opacity=".12" filter="url(#blur)"/>
<g fill="#f5eaff" filter="url(#shine)">
 <circle cx="740" cy="72" r="2"/><circle cx="1130" cy="76" r="1.6"/><circle cx="1190" cy="310" r="2"/>
 <circle cx="690" cy="400" r="1.5"/><circle cx="1015" cy="455" r="1.5"/><circle cx="845" cy="42" r="1.2"/>
 <circle cx="1080" cy="390" r="2"/><circle cx="625" cy="190" r="1.3"/><circle cx="1230" cy="180" r="1.2"/>
</g>
<g stroke="#d8b4fe" stroke-opacity=".7" fill="none">
