<path d="M866 177C855 111 896 69 956 67C1024 65 1072 113 1064 180L1036 157L1024 123L1004 149L985 111L964 157L942 120L927 164L903 139L893 180Z" fill="#171024" stroke="#9b78d0" stroke-width="2"/>
<!-- face shadow and eyes -->
<path d="M902 177L928 154L964 166L1000 153L1035 180L1022 229L969 267L915 229Z" fill="url(#skin)" opacity=".9"/>
<path d="M911 187l43 7-23 13-22-5zm66 7 42-8-1 15-22 6z" fill="#170e2b"/>
<path d="M930 198l17 2m39 0 17-2" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round" filter="url(#shine)"/>
