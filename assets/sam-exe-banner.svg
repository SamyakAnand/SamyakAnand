<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">SAM.exe — The AI Universe</title>
<desc id="desc">An original anime-inspired hooded AI engineer silhouette standing in a violet cosmic nebula with orbiting particles and terminal-inspired typography.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080611"/><stop offset=".52" stop-color="#1b1034"/><stop offset="1" stop-color="#090713"/></linearGradient>
  <radialGradient id="nebula"><stop stop-color="#a855f7" stop-opacity=".55"/><stop offset=".48" stop-color="#6d28d9" stop-opacity=".22"/><stop offset="1" stop-color="#090713" stop-opacity="0"/></radialGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0abfc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35205c"/><stop offset="1" stop-color="#100b20"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#c4b5fd" stroke-opacity=".07" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="420" rx="26" fill="url(#bg)"/>
