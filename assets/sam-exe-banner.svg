<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
 <text x="72" y="92" fill="#c4b5fd" font-size="14" letter-spacing="5">INDEPENDENT AI ENGINEER  /  INDIA</text>
 <text x="66" y="224" fill="#fff" font-size="100" font-weight="800" letter-spacing="-7">SAM<tspan fill="url(#edge)">.exe</tspan></text>
 <path d="M76 252H590" stroke="url(#edge)" stroke-width="2"/>
 <text x="76" y="298" fill="#e9d5ff" font-size="23" letter-spacing="2">BEYOND THE PROMPT.</text>
 <text x="78" y="343" fill="#b9a5d8" font-size="15" letter-spacing="2">AI SYSTEMS  /  AGENTIC WORKFLOWS  /  DATA</text>
 <text x="78" y="422" fill="#8f7baa" font-size="12" letter-spacing="2">[ CURIOSITY: INFINITE ]</text>
 <text x="78" y="450" fill="#8f7baa" font-size="12" letter-spacing="2">[ STATUS: ALWAYS BUILDING ]</text>
 <text x="1130" y="490" fill="#bba1e6" font-size="10" letter-spacing="2">001 / 026</text>
</g>
<rect x="1" y="1" width="1278" height="518" rx="27" fill="none" stroke="#a78bfa" stroke-opacity=".45"/>
</svg>