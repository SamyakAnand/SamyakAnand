 <path d="M790 72l14-14m-14 0 14 14M1160 140l12-12m-12 0 12 12"/>
</g>
<!-- portal behind the character -->
<ellipse cx="960" cy="260" rx="138" ry="188" fill="none" stroke="#c4b5fd" stroke-width="2" opacity=".6" filter="url(#shine)"/>
<ellipse cx="960" cy="260" rx="123" ry="172" fill="none" stroke="#7c3aed" stroke-width="10" opacity=".2"/>
